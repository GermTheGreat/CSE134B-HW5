        <h1>Form</h1>

    <main>
        <h2>Form</h2>
        <p>Our form with no JavaScript.</p>
        <form action="https://httpbin.org/post" method="post">
            <fieldset>
                <legend>Send some comments</legend>

                <div>
                    <label for="name">Name (required)</label>
                    <input type="text" id="name" name="name" autocomplete="name" placeholder="Ex. John Doe" required
                        minlength="1" maxlength="100" aria-describedby="name-hint">
                    <small id="name-hint">1 to 100 characters.</small>
                </div>

                <div>
                    <label for="email">Email (required)</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="Ex. ex@example.com"
                        required>
                </div>

                <div>
                    <label for="comments">Comments (required)</label>
                    <textarea id="comments" name="comments" placeholder="Type comments to be sent" required
                        minlength="10" maxlength="1000" aria-describedby="comments-hint"></textarea>
                    <small id="comments-hint">10 to 1,000 characters.</small>
                </div>

                <input type="hidden" name="possible_bot" value="true">

                <button type="submit">Send</button>
            </fieldset>
        </form>
    </main>
    <footer>
